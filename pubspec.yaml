name: godspeed_ginny
description: "Godspeed Ginny — river trials. Skipper comedy on the McRiver."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.38.2
  shared_preferences: ^2.5.6
  google_fonts: ^6.2.1
  flutter_native_splash: ^2.4.6
  sentry_flutter: ^10.3.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#010101"
  adaptive_icon_foreground: assets/branding/app_icon.png
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#010101"
    theme_color: "#2C5F5C"
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/app_icon.png

flutter_native_splash:
  color: "#B8BEDB"
  image: assets/branding/splash.png
  color_dark: "#0B1A1A"
  image_dark: assets/branding/splash.png
  android_12:
    color: "#B8BEDB"
    icon_background_color: "#010101"
    image: assets/branding/app_icon.png
    color_dark: "#0B1A1A"
    icon_background_color_dark: "#010101"
    image_dark: assets/branding/app_icon.png
  ios: true
  web: true
  android: true
  fullscreen: true
